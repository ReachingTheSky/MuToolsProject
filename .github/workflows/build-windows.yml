# 在 GitHub 上编译 Windows 安装包（NSIS + MSI），无需本地 Rust。
# 用法：仓库页 → Actions → Build Windows installer → Run workflow
# 完成后在该次运行页面下载 Artifacts：mutools-windows
name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: MuToolsCode

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MuToolsCode/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: MuToolsCode/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: mutools-windows
          path: |
            MuToolsCode/src-tauri/target/release/bundle/nsis/*.exe
            MuToolsCode/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
